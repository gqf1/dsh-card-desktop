# dsh-desk-all bundle patch：卡片桌面全家桶
#
# 本文件把两个插件行插进 profile 的插件清单。两条行各自独立，
# 想关掉哪个就在插件管理器里关哪一行（或在本文件里给它加 disabled: true）。
#
#   行 id           插件包名            用途
#   card-desktop    dsh-card-desktop    卡片桌面 / 代码工作台（Explorer + 编辑器 + Git + 静态检查）
#   music-hub       dsh-music-hub       音乐播放器（本地曲库 + QQ/酷狗/网易云），播放条挂在输入框上方
#
# 两个插件互不依赖：
#   - 只留 card-desktop：用代码工作台，卡片桌面里的「音乐」入口打开是空面板，不影响其它功能。
#   - 只留 music-hub：播放条照常出现，卡片桌面整个不出现。
#   - 都留：卡片桌面里多一个「音乐」卡片，点进去是内嵌播放器页面。
#
# 行名必须对应**已安装的包**：本包的 dependencies 已声明这两个包，
# 用 `dsh plugin add` / 插件管理器装本包时它们会被一起装到 profile 的 node_modules 里。
# 不要把这些行再手写进 profile 自己的 cordis.patch.yml，否则会重复挂载。
- insert:
    - id: card-desktop
      name: 'dsh-card-desktop'
    - id: music-hub
      name: 'dsh-music-hub'
